# ============================================================================
# CorAi — Render Blueprint (PAID Starter plan only).
#
# The Render FREE plan is not viable for this stack: 512 MB RAM is not enough
# to build or run the ML/RAG dependencies (scikit-learn, lightgbm, shap,
# langchain, faiss-cpu, sentence-transformers), and free instances do not
# support persistent disks — so the trained model and SQLite DB would be
# wiped on every redeploy. Use Hugging Face Spaces (Docker) for a free
# deployment; see DEPLOY_HF_SPACES.md.
#
# Cost: $7.50/month total ($7 web service + $0.50 2 GB disk). Always-on,
# no cold start, persistent model artifact and SQLite database at /data.
# ============================================================================
services:
  - type: web
    name: corai
    runtime: docker
    plan: starter                       # $7/mo, always-on, persistent disk
    region: oregon                      # most reliably available region
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    disk:                                # 2 GB persistent disk at /data
      name: corai-data
      mountPath: /data
      sizeGB: 2
    envVars:
      # --- Flask -------------------------------------------------------------
      - key: FLASK_CONFIG
        value: config.Config
      - key: SECRET_KEY
        generateValue: true              # Render generates + stores this
      - key: SESSION_COOKIE_SECURE
        value: "1"                       # cookies over HTTPS only
      # --- Persistent data (Render disk mounted at /data) --------------------
      - key: DATABASE_URL
        value: sqlite:////data/corai.db
      - key: MODEL_PATH
        value: /data/models/corai-1.0.0.pkl
      - key: CorAi_RAG_INDEX
        value: /data/.rag_cache/corai_index
      - key: CorAi_HF_CACHE
        value: /data/.hf_cache
      # --- RAG chatbot (optional — leave blank to disable) ------------------
      - key: GOOGLE_API_KEY
        sync: false                      # set manually in Render dashboard
      # --- Bootstrap admin ---------------------------------------------------
      - key: BOOTSTRAP_DOCTOR_USERNAME
        value: doctor
      - key: BOOTSTRAP_DOCTOR_PASSWORD
        value: "change-me-after-first-login"   # override in Render dashboard after first deploy
      - key: BOOTSTRAP_DOCTOR_EMAIL
        value: doctor@corai.local
      - key: BOOTSTRAP_DOCTOR_AREA
        value: India
