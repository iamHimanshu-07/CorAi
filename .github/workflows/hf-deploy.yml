name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Deploy to Hugging Face Space
        uses: huggingface/deploy-space-action@v1
        with:
          # Your Space id, e.g. "iamHimanshu-07/corai". MUST match the
          # Space you've manually created on huggingface.co first.
          space_id: iamHimanshu-07/corai
          # The HF write token, stored as a GitHub Secret. Create one at
          # https://huggingface.co/settings/tokens with "Write" scope.
          hf_token: ${{ secrets.HF_TOKEN }}
          # Push the whole repo (or a subdirectory in a monorepo).
          source_dir: .
          # Pin the Space to the CPU basic hardware (free tier).
          hardware: cpu-basic
          # Don't recreate the Space on every push — only push code.
          create_space: false
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
