# Render Blueprint for CorAi.
#
# Deploy with: render blueprint launch
# Or visit: https://dashboard.render.com/blueprints
#
# Free tier notes:
#   - Spins down after 15 min idle (cold start ~1 min).
#   - No persistent disk on free — SQLite DB and model artifact are retrained
#     on every boot. That's fine for a portfolio/demo app.
#   - All env vars below become "Sync env" on the Render dashboard; secrets
#     marked generateValue: true are auto-generated by Render on first deploy
#     and shown to you once.

services:
  - type: web
    name: corai
    runtime: python
    plan: free
    # If Dockerfile + render.yaml both exist, Render prefers the Dockerfile.
    # We provide it for clarity over the Python buildpack behaviour, but
    # you can delete the Dockerfile and remove `dockerfilePath` to fall
    # back to the buildpack (which auto-runs `pip install -r requirements.txt`
    # then `gunicorn app:create_app()`).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    branch: main

    healthCheckPath: /healthz

    # Render sets PORT for us — bind to it.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"

      # Auto-generated secure values — Render shows them in the dashboard
      # AFTER the first deploy.
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_DOCTOR_PASSWORD
        generateValue: true

      # You can override BOOTSTRAP_DOCTOR_USERNAME etc. here, or in the
      # Render dashboard after first deploy.

      # Optional: enable HeartAI Copilot. Set to your real key in the
      # Render dashboard (as a secret, not in this file).
      # - key: GOOGLE_API_KEY
      #   sync: false
