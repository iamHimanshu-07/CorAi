[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # line length handled by formatter; B008 false-positives in Flask routes

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"