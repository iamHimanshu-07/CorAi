{% extends "base.html" %}
{% block title %}New patient · HDPS{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <h1>New patient</h1>
    <p class="muted">Add a patient to the registry. 11 clinical features used by the model.</p>
  </div>
  <p><a class="btn btn-secondary" href="{{ url_for('patients.list_patients') }}">← Back</a></p>
</header>

<form method="post" action="{{ url_for('patients.create_patient') }}" class="form-card">
  <div class="form-section">
    <h3>Identity</h3>
    <div class="grid-2">
      <label>Name <input name="name" required></label>
      <label>Age (years) <input name="age" type="number" step="0.1" min="0" max="120" required></label>
    </div>
  </div>

  <div class="form-section">
    <h3>Clinical measurements</h3>
    <div class="grid-2">
      <label>Resting BP (mmHg) <input name="restingbp" type="number" step="0.1" min="0" max="300" required></label>
      <label>Cholesterol (mg/dL) <input name="cholesterol" type="number" step="0.1" min="0" max="1000" required></label>
      <label>Fasting BS &gt; 120 mg/dL
        <select name="fastingbs"><option value="0">No (0)</option><option value="1">Yes (1)</option></select>
      </label>
      <label>Max HR (bpm) <input name="maxhr" type="number" step="0.1" min="0" max="300" required></label>
      <label>Oldpeak (ST depression) <input name="oldpeak" type="number" step="0.1" min="-5" max="10" required></label>
      <label>Sex
        <select name="sex">
          <option value="M">Male</option><option value="F">Female</option>
        </select>
      </label>
      <label>Chest pain type
        <select name="cp">
          <option>ATA</option><option>NAP</option><option>ASY</option><option>TA</option>
        </select>
      </label>
      <label>Resting ECG
        <select name="restecg">
          <option>Normal</option><option>ST</option><option>LVH</option>
        </select>
      </label>
      <label>Exercise angina
        <select name="exang">
          <option value="N">No</option><option value="Y">Yes</option>
        </select>
      </label>
      <label>ST slope
        <select name="slope">
          <option>Up</option><option>Flat</option><option>Down</option>
        </select>
      </label>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Create patient</button>
    <a class="btn btn-secondary" href="{{ url_for('patients.list_patients') }}">Cancel</a>
  </div>
</form>
{% endblock %}
