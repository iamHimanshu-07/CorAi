# Local dev compose: spin up corai with a bind-mounted heart.csv.
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_CONFIG: config.Config
      SECRET_KEY: change-me-in-production
    volumes:
      - ./heart.csv:/app/heart.csv:ro
      - corai-models:/app/models
      - corai-data:/app/instance

volumes:
  corai-models:
  corai-data: